[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-x-agent"
version = "0.2.0"
description = "A safety-first task control loop for the Project X Mac mini agent."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-x-agent = "project_x_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
